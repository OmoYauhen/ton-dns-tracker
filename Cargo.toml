[workspace]
resolver = "2"
members = ["crates/core", "crates/indexer", "crates/ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/OmoYauhen/ton-dns-tracker"
publish = false

[workspace.dependencies]
ton-dns-core = { path = "crates/core" }

diesel = { version = "2.2", features = ["postgres", "chrono", "serde_json", "numeric"] }
diesel-async = { version = "0.9", features = ["postgres", "bb8"] }
bb8 = "0.9"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

tonlib-core = "0.24"
num-bigint = "0.4"
bigdecimal = "0.4"
sha2 = "0.10"
base64 = "0.22"
crc = "3"
hex = "0.4"

axum = "0.8"
askama = "0.12"

thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[profile.release]
lto = "thin"
